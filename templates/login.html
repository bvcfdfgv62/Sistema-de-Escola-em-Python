<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TriadCode</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-wrap">

    <div class="login-card">
        <h1>TriadCode</h1>
        
        <form action="{{ url_for('auth.login') }}" method="POST">
            <div style="text-align: left; margin-bottom: 16px;">
                <label style="font-size: 0.75rem; font-weight: 700; color: var(--text-dim);">USUÁRIO</label>
                <input type="text" name="username" class="input-field" required>
            </div>
            
            <div style="text-align: left; margin-bottom: 24px;">
                <label style="font-size: 0.75rem; font-weight: 700; color: var(--text-dim);">SENHA</label>
                <input type="password" name="senha" class="input-field" required>
            </div>

            {% if error %}
            <p style="color: var(--error-text); font-size: 0.8rem; margin-bottom: 16px;">{{ error }}</p>
            {% endif %}

            <button type="submit" class="btn-primary" style="width: 100%;">Entrar</button>
        </form>
    </div>

</body>
</html>
